name: CI - MyLibrary
on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [main, develop]
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: cd backend/mylibrary-backend && mvn verify --no-transfer-progress
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/mylibrary-frontend/package-lock.json
      - run: cd frontend/mylibrary-frontend && npm ci
      - run: cd frontend/mylibrary-frontend && npm run build